[package]
name = "openjev-llama"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native = ["dep:hf-hub", "dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:tracing-subscriber"]
metal = ["native", "llama-cpp-2/metal", "llama-cpp-sys-2/metal"]
cuda = ["native", "llama-cpp-2/cuda", "llama-cpp-sys-2/cuda"]
integration = ["native"]

[dependencies]
hf-hub = { workspace = true, optional = true }
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { workspace = true, optional = true }
openjev-core = { path = "../openjev-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
