[workspace]
members = [
    "crates/openjev-core",
    "crates/openjev-llama",
]
default-members = ["crates/openjev-core", "crates/openjev-llama"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/codesoda/openjev-rs"

[workspace.dependencies]
hf-hub = { version = "=1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
jsonschema = { version = "=0.56.0", default-features = false }
llama-cpp-2 = { version = "=0.1.156", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.156", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "raw_value"] }
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
